name: Fix second capability formatting

on:
  push:
    branches: [codex/second-admin-capability]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/second-admin-capability
      - name: Fix Ruff spacing
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/portable_runtime/responsibility/domain_effect_verified_outcome.py")
          text = path.read_text()
          old = "    require_domain_effect_completion_contract,\n)\n\ndef domain_effect_verification_capability"
          new = "    require_domain_effect_completion_contract,\n)\n\n\ndef domain_effect_verification_capability"
          if old not in text:
              raise SystemExit("expected import/function boundary not found")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/fix-second-capability-format.yml").unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix bounded domain-effect verification formatting"
          git push origin HEAD:codex/second-admin-capability
