name: FB2 Test Fix
on:
  push:
    branches: [feat/verified-outcome-authority-impl]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - shell: python
        run: |
          from pathlib import Path
          p = Path('tests/conformance/test_verified_outcome_authority.py')
          s = p.read_text()
          s = s.replace('kwargs = dict(work=work, run=run, attempt=attempt, action=action, evidence_refs=[proof.id])', 'kwargs = {"work": work, "run": run, "attempt": attempt, "action": action, "evidence_refs": [proof.id]}')
          s = s.replace('with _store("memory", tmp_path) as target:\n        with pytest.raises(ValueError):\n            target.import_state(state)', 'with _store("memory", tmp_path) as target, pytest.raises(ValueError):\n        target.import_state(state)')
          p.write_text(s)
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/conformance/test_verified_outcome_authority.py
          git commit -m "test: satisfy F1-B2 freeze lint"
          git push