name: FB2 P6 Closure Patch
on:
  push:
    branches: [feat/verified-outcome-authority-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - shell: python
        run: |
          import base64
          import re
          from pathlib import Path

          facade_b64 = ""
          arch_b64 = ""
          doc_b64 = ""

          Path('src/portable_runtime/records/verified_outcome.py').write_bytes(base64.b64decode(facade_b64))

          init_path = Path('src/portable_runtime/records/__init__.py')
          init_text = init_path.read_text()
          if 'from .verified_outcome import VerifiedOutcomeAuthority' not in init_text:
              init_text = init_text.replace(
                  ')\n\n__all__ = [',
                  ')\nfrom .verified_outcome import VerifiedOutcomeAuthority\n\n__all__ = [',
                  1,
              )
              init_text = init_text.replace(
                  '    "commit_qualification_transition",\n]',
                  '    "commit_qualification_transition",\n    "VerifiedOutcomeAuthority",\n]',
                  1,
              )
          init_path.write_text(init_text)

          test_path = Path('tests/conformance/test_verified_outcome_authority.py')
          test_text = test_path.read_text()
          if 'import ast\n' not in test_text:
              test_text = test_text.replace('import importlib\n', 'import ast\nimport importlib\nimport inspect\n', 1)
          test_text = test_text.replace(
              '\n\ndef _xfail(reason: str) -> pytest.MarkDecorator:\n    return pytest.mark.xfail(strict=True, reason=reason)\n',
              '',
          )
          test_text = re.sub(r'^@_xfail\([^\n]+\)\n', '', test_text, flags=re.MULTILINE)
          if 'test_fb2_p6_verified_outcome_authority_is_thin_commit_only_facade' not in test_text:
              test_text += base64.b64decode(arch_b64).decode()
          test_path.write_text(test_text)

          doc_path = Path('docs/f1-b2-verified-outcome-authority-closure.md')
          doc_path.write_bytes(base64.b64decode(doc_b64))
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/records/verified_outcome.py src/portable_runtime/records/__init__.py tests/conformance/test_verified_outcome_authority.py docs/f1-b2-verified-outcome-authority-closure.md
          git commit -m "feat: expose verified outcome authority facade"
          git push
