name: FB2 A03 Graduate
on:
  push:
    branches: [feat/verified-outcome-authority-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - shell: python
        run: |
          import base64
          from pathlib import Path

          encoded = ""
          replacement = base64.b64decode(encoded).decode()
          p = Path('tests/conformance/test_verified_outcome_authority.py')
          s = p.read_text()
          start = s.index('@_xfail("FB2-A03: import authority graph closure validation not implemented")')
          p.write_text(s[:start] + replacement)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/conformance/test_verified_outcome_authority.py
          git commit -m "test: graduate FB2-A03 import authority counterexample"
          git push