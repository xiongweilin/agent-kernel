name: FB2 P3 Patch
on:
  push:
    branches: [feat/verified-outcome-authority-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - shell: python
        run: |
          from pathlib import Path
          p = Path('src/portable_runtime/workflows/completion.py')
          s = p.read_text()
          import_line = 'from portable_runtime.records.verification_binding import BoundVerificationEvidenceValidator\n'
          anchor = 'from portable_runtime.interfaces.store import StateStore\n'
          if import_line not in s:
              if anchor not in s: raise SystemExit('import anchor missing')
              s = s.replace(anchor, anchor + import_line, 1)

          start = s.index('    @staticmethod\n    def _proof_metadata')
          end = s.index('    @staticmethod\n    def validate_proof_invariant', start)
          wrappers = '''    @staticmethod\n    def _proof_metadata(record: object) -> dict[str, Any] | None:\n        return BoundVerificationEvidenceValidator.proof_metadata(record)\n\n    @staticmethod\n    def _proof_class(record: object, metadata: dict[str, Any]) -> str:\n        return BoundVerificationEvidenceValidator.proof_class(record, metadata)\n\n    @staticmethod\n    def _proof_can_cover(proof_class: str, obligation: str) -> bool:\n        return BoundVerificationEvidenceValidator.proof_can_cover(proof_class, obligation)\n\n'''
          s = s[:start] + wrappers + s[end:]

          loop_start = s.index('        covered_obligations: set[str] = set()\n', s.index('    def validate_proof_invariant'))
          required_anchor = '        required = sorted(required_obligations)\n'
          loop_end = s.index(required_anchor, loop_start)
          replacement = '''        validated = BoundVerificationEvidenceValidator.validate(\n            work=work,\n            run=run,\n            refs=normalized,\n            record_lookup=record_lookup,\n            expected_scope=expected_scope,\n            allowed_results=frozenset({"pass"}),\n            expected_work_version=expected_version,\n            expected_acceptance_criteria=expected_criteria,\n        )\n        covered_obligations: set[str] = set()\n        for record, proof_class in zip(validated.records, validated.proof_classes, strict=True):\n            metadata = BoundVerificationEvidenceValidator.proof_metadata(record) or {}\n            raw_coverage = metadata.get(\n                "obligation_refs",\n                metadata.get("covered_obligations", metadata.get("verification_obligations", [])),\n            )\n            candidates: list[str] = []\n            if isinstance(raw_coverage, str) and raw_coverage.strip():\n                candidates.append(raw_coverage.strip())\n            elif isinstance(raw_coverage, list):\n                candidates.extend(\n                    item.strip() for item in raw_coverage if isinstance(item, str) and item.strip()\n                )\n            covered_obligations.update(\n                obligation\n                for obligation in candidates\n                if (obligation not in revalidation_obligations or proof_class == "revalidation")\n                and BoundVerificationEvidenceValidator.proof_can_cover(proof_class, obligation)\n            )\n'''
          s = s[:loop_start] + replacement + s[loop_end:]
          p.write_text(s)
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/workflows/completion.py
          git commit -m "refactor: share bound verification evidence validation"
          git push