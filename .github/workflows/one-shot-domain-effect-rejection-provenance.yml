name: One-shot domain effect rejection provenance patch

on:
  push:
    branches: [codex/domain-effect-precommit-rejection-provenance]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/domain-effect-precommit-rejection-provenance
      - name: Preserve precommit-before boundary rejection
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/portable_runtime/public_contracts/domain_effect.py')
          text = path.read_text()
          old = '''        attempt = self._attempt_for_request(run_result.run_ref, request.id)\n        if attempt is None:\n            raise ValueError("bounded domain-effect execution returned without durable Attempt")\n'''
          new = '''        attempt = self._attempt_for_request(run_result.run_ref, request.id)\n        if attempt is None:\n            error = result.error if isinstance(result.error, dict) else {}\n            code = error.get("code")\n            reason = error.get("reason") or result.message\n            if isinstance(code, str) and code:\n                detail = f": {reason}" if isinstance(reason, str) and reason else ""\n                raise ValueError(\n                    f"bounded domain-effect execution blocked before durable Attempt: {code}{detail}"\n                )\n            if isinstance(reason, str) and reason:\n                raise ValueError(\n                    "bounded domain-effect execution blocked before durable Attempt: " + reason\n                )\n            raise ValueError("bounded domain-effect execution returned without durable Attempt")\n'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/one-shot-domain-effect-rejection-provenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/portable_runtime/public_contracts/domain_effect.py .github/workflows/one-shot-domain-effect-rejection-provenance.yml
          git commit -m 'Preserve boundary rejection before durable Attempt'
          git push origin HEAD:codex/domain-effect-precommit-rejection-provenance
