name: EUA-D integration patch

on:
  push:
    branches: [feat/historical-experience-use]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'EUA-D: apply store-owned historical-use integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/historical-experience-use
          fetch-depth: 0
      - name: Apply exact EUA-D integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"anchor not unique in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # EUA-B exposes the eligibility semantic contract explicitly; the
          # snapshot representation schema is deliberately a different id.
          path = "src/portable_runtime/experience/use_admission.py"
          replace(
              path,
              ']\n_NegativeApplicability = Literal["current", "outside", "unknown"]',
              ']\n\nEXPERIENCE_USE_ADMISSION_CONTRACT_VERSION = "experience-use-admission-v1"\n_NegativeApplicability = Literal["current", "outside", "unknown"]',
          )
          replace(
              path,
              '    resolved_snapshot: ResolvedExperienceUseSnapshot\n    reasons: tuple[str, ...] = ()',
              '    resolved_snapshot: ResolvedExperienceUseSnapshot\n    admission_contract_version: str = EXPERIENCE_USE_ADMISSION_CONTRACT_VERSION\n    reasons: tuple[str, ...] = ()',
          )
          replace(
              path,
              '            resolved_snapshot=snapshot,\n            reasons=tuple(sorted(set(reasons))),',
              '            resolved_snapshot=snapshot,\n            admission_contract_version=EXPERIENCE_USE_ADMISSION_CONTRACT_VERSION,\n            reasons=tuple(sorted(set(reasons))),',
          )
          replace(
              path,
              '__all__ = [\n    "ExperienceUseAdmission",',
              '__all__ = [\n    "EXPERIENCE_USE_ADMISSION_CONTRACT_VERSION",\n    "ExperienceUseAdmission",',
          )

          # The historical authority checks qualifying-vs-consuming role
          # before any new binding is permitted. Existing historical replay
          # intentionally does not consult current projections.
          path = "src/portable_runtime/experience/historical_use.py"
          replace(
              path,
              'class HistoricalExperienceUseStoreReader(Protocol):\n    def get_record(self, record_id: str) -> object | None: ...\n    def get_event(self, event_id: str) -> Event | None: ...\n    def export_state(self) -> dict[str, list[dict[str, object]]]: ...',
              'class HistoricalExperienceUseStoreReader(Protocol):\n    def get_record(self, record_id: str) -> object | None: ...\n    def get_event(self, event_id: str) -> Event | None: ...\n    def get_knowledge_projection(self, projection_id: str) -> object | None: ...\n    def export_state(self) -> dict[str, list[dict[str, object]]]: ...',
          )
          replace(
              path,
              'def _validate_role_separation(judgment: Assertion, admission: ExperienceUseAdmission) -> None:\n',
              '''def _validate_role_separation_from_current_projections(\n    store: HistoricalExperienceUseStoreReader,\n    judgment: Assertion,\n    requirement: ExperienceUseRequirement,\n) -> None:\n    for projection_ref in requirement.projection_refs:\n        projection = store.get_knowledge_projection(projection_ref)\n        if projection is None:\n            continue\n        for field in ("epistemic_judgment_refs", "current_assertion_refs"):\n            refs = getattr(projection, field, ())\n            if judgment.id in refs:\n                raise ValueError(\n                    "task/domain judgment cannot be an assertion or epistemic judgment that qualifies selected experience"\n                )\n\n\ndef _validate_role_separation(judgment: Assertion, admission: ExperienceUseAdmission) -> None:\n''',
          )
          replace(
              path,
              '    existing_event = store.get_event(event_id)\n    existing_record = store.get_record(request.judgment.id)\n\n    if existing_event is not None:',
              '    existing_event = store.get_event(event_id)\n    if existing_event is None:\n        _validate_role_separation_from_current_projections(store, request.judgment, request.requirement)\n    existing_record = store.get_record(request.judgment.id)\n\n    if existing_event is not None:',
          )

          Path("src/portable_runtime/experience/__init__.py").write_text('''"""Experience Governance admission and historical-use authority surfaces."""\n\nfrom portable_runtime.experience.historical_use import (\n    DOMAIN_JUDGMENT_SEMANTIC_ROLE,\n    HISTORICAL_EXPERIENCE_USE_EVENT_TYPE,\n    HistoricalExperienceUse,\n    HistoricalExperienceUseCommitRequest,\n    historical_experience_use_from_event,\n)\nfrom portable_runtime.experience.use_admission import (\n    EXPERIENCE_USE_ADMISSION_CONTRACT_VERSION,\n    ExperienceUseAdmission,\n    ExperienceUseAdmissionEvaluator,\n    ExperienceUseRequirement,\n    ExperienceUseStatus,\n    ResolvedExperienceUseSnapshot,\n)\n\n__all__ = [\n    "DOMAIN_JUDGMENT_SEMANTIC_ROLE",\n    "EXPERIENCE_USE_ADMISSION_CONTRACT_VERSION",\n    "HISTORICAL_EXPERIENCE_USE_EVENT_TYPE",\n    "ExperienceUseAdmission",\n    "ExperienceUseAdmissionEvaluator",\n    "ExperienceUseRequirement",\n    "ExperienceUseStatus",\n    "HistoricalExperienceUse",\n    "HistoricalExperienceUseCommitRequest",\n    "ResolvedExperienceUseSnapshot",\n    "historical_experience_use_from_event",\n]\n''', encoding="utf-8")

          # StateStore protocol exposes one typed authority primitive.
          path = "src/portable_runtime/interfaces/store.py"
          replace(
              path,
              'from portable_runtime.records.knowledge import KnowledgeProjection\n',
              'from portable_runtime.experience.historical_use import (\n    HistoricalExperienceUse,\n    HistoricalExperienceUseCommitRequest,\n)\nfrom portable_runtime.records.knowledge import KnowledgeProjection\n',
          )
          replace(
              path,
              '    def commit_verified_outcome(self, request: VerifiedOutcomeCommitRequest) -> OutcomeRecord: ...\n',
              '    def commit_verified_outcome(self, request: VerifiedOutcomeCommitRequest) -> OutcomeRecord: ...\n    def commit_historical_experience_use(\n        self, request: HistoricalExperienceUseCommitRequest\n    ) -> HistoricalExperienceUse: ...\n',
          )

          # Memory: factor ordinary record validation so EUA-D cannot bypass
          # canonical/transition/graph responsibilities, then commit J+event
          # under the existing rollback-capable transaction.
          path = "src/portable_runtime/stores/memory.py"
          replace(
              path,
              '        self._recovery_application_commit_depth = 0\n        self._provider_execution_binding_dispatch_commit_depth = 0',
              '        self._recovery_application_commit_depth = 0\n        self._historical_experience_use_commit_depth = 0\n        self._provider_execution_binding_dispatch_commit_depth = 0',
          )
          anchor = '''    def commit_outcome_impact_judgment(self, request: Any, impact_policy: Any, disposition_policy: Any) -> Any:\n'''
          method = '''    def commit_historical_experience_use(self, request: Any) -> Any:\n        """Atomically compare-and-bind one task/domain judgment to exact experience semantics."""\n        from portable_runtime.experience.historical_use import (\n            freeze_historical_experience_use_request,\n            historical_experience_use_event_id,\n            prepare_historical_experience_use_commit,\n            validate_historical_experience_use_authority_graph,\n        )\n\n        frozen = freeze_historical_experience_use_request(request)\n        with self.transaction():\n            event_id = historical_experience_use_event_id(frozen.judgment.id, frozen.judgment.version)\n            if self.get_event(event_id) is None and self.get_record(frozen.judgment.id) is None:\n                self._validate_record_write_semantics(frozen.judgment)\n                self._validate_candidate_write("record", frozen.judgment)\n            prepared = prepare_historical_experience_use_commit(self, frozen)\n            if prepared.replayed:\n                validate_historical_experience_use_authority_graph(self.export_state())\n                return prepared.binding\n\n            # Raw storage is used only after the exact same semantic and graph\n            # validation gates as save_record have succeeded above.\n            self._save("record", prepared.judgment)\n            self._historical_experience_use_commit_depth += 1\n            try:\n                self.append_event(prepared.event)\n            finally:\n                self._historical_experience_use_commit_depth -= 1\n            validate_historical_experience_use_authority_graph(self.export_state())\n            return prepared.binding\n\n'''
          replace(path, anchor, method + anchor)
          old = '''    # Records R1.2 implementation milestone\n    def save_record(self, value: BaseRecord) -> None:\n        try:\n            from portable_runtime.records.authorization import AuthorizationGrant\n            if isinstance(value, AuthorizationGrant):\n                self.save_authorization(value)\n                return\n        except Exception:\n            pass\n        from portable_runtime.protocol.validation import assert_semantic_mutation_authorized, validate_record_write\n        from portable_runtime.records.validation import validate_canonical_write\n        def validate() -> None:\n            existing = cast(BaseRecord | None, self._records["record"].get(value.id))\n            errs = [*validate_record_write(value, existing), *validate_canonical_write(value)]\n            if errs:\n                raise ValueError("; ".join(errs))\n            assert_semantic_mutation_authorized(value, existing, self.export_state())\n\n        with self._lock:\n            validate()\n            self._validate_candidate_write("record", value)\n            self._save("record", value)\n'''
          new = '''    # Records R1.2 implementation milestone\n    def _validate_record_write_semantics(self, value: BaseRecord) -> None:\n        from portable_runtime.protocol.validation import assert_semantic_mutation_authorized, validate_record_write\n        from portable_runtime.records.validation import validate_canonical_write\n\n        existing = cast(BaseRecord | None, self._records["record"].get(value.id))\n        errs = [*validate_record_write(value, existing), *validate_canonical_write(value)]\n        if errs:\n            raise ValueError("; ".join(errs))\n        assert_semantic_mutation_authorized(value, existing, self.export_state())\n\n    def save_record(self, value: BaseRecord) -> None:\n        try:\n            from portable_runtime.records.authorization import AuthorizationGrant\n            if isinstance(value, AuthorizationGrant):\n                self.save_authorization(value)\n                return\n        except Exception:\n            pass\n        with self._lock:\n            self._validate_record_write_semantics(value)\n            self._validate_candidate_write("record", value)\n            self._save("record", value)\n'''
          replace(path, old, new)
          replace(
              path,
              '        if value.type == "RecoveryApplicationRecorded" and self._recovery_application_commit_depth <= 0:\n            raise ValueError("RecoveryApplication events require commit_recovery_application")\n',
              '        if value.type == "RecoveryApplicationRecorded" and self._recovery_application_commit_depth <= 0:\n            raise ValueError("RecoveryApplication events require commit_recovery_application")\n        if value.type == "HistoricalExperienceUseRecorded" and self._historical_experience_use_commit_depth <= 0:\n            raise ValueError("HistoricalExperienceUse events require commit_historical_experience_use")\n',
          )
          replace(
              path,
              '    def import_state(self, state: dict[str, list[dict[str, object]]]) -> None:\n        types: dict[str, type[Any]] = {',
              '    def import_state(self, state: dict[str, list[dict[str, object]]]) -> None:\n        from portable_runtime.experience.historical_use import assert_historical_experience_use_import_closed\n\n        assert_historical_experience_use_import_closed(state)\n        types: dict[str, type[Any]] = {',
          )

          # SQLite: same semantics, but BEGIN IMMEDIATE is the linearization
          # envelope. The final authority graph check occurs before COMMIT.
          path = "src/portable_runtime/stores/sqlite.py"
          replace(
              path,
              '        self._recovery_application_commit_depth = 0\n        self._provider_execution_binding_dispatch_commit_depth = 0',
              '        self._recovery_application_commit_depth = 0\n        self._historical_experience_use_commit_depth = 0\n        self._provider_execution_binding_dispatch_commit_depth = 0',
          )
          anchor = '''    def commit_outcome_impact_judgment(self, request: Any, impact_policy: Any, disposition_policy: Any) -> Any:\n'''
          method = '''    def commit_historical_experience_use(self, request: Any) -> Any:\n        """Writer-serialized compare-and-bind of one judgment to exact experience semantics."""\n        from portable_runtime.experience.historical_use import (\n            freeze_historical_experience_use_request,\n            historical_experience_use_event_id,\n            prepare_historical_experience_use_commit,\n            validate_historical_experience_use_authority_graph,\n        )\n\n        frozen = freeze_historical_experience_use_request(request)\n        with self._lock:\n            owns_transaction = not self._connection.in_transaction\n            if owns_transaction:\n                self._connection.execute("BEGIN IMMEDIATE")\n            try:\n                event_id = historical_experience_use_event_id(frozen.judgment.id, frozen.judgment.version)\n                if self.get_event(event_id) is None and self.get_record(frozen.judgment.id) is None:\n                    self._validate_record_write_semantics(frozen.judgment)\n                    self._validate_candidate_write("record", frozen.judgment)\n                prepared = prepare_historical_experience_use_commit(self, frozen)\n                if not prepared.replayed:\n                    # Full save_record semantic/graph gates ran above; raw\n                    # write merely keeps J and its authority event atomic.\n                    self._save("record", prepared.judgment)\n                    self._historical_experience_use_commit_depth += 1\n                    try:\n                        self.append_event(prepared.event)\n                    finally:\n                        self._historical_experience_use_commit_depth -= 1\n                validate_historical_experience_use_authority_graph(self.export_state())\n                if owns_transaction:\n                    self._connection.execute("COMMIT")\n                return prepared.binding\n            except Exception:\n                if owns_transaction:\n                    self._rollback(self._connection.cursor())\n                raise\n\n'''
          replace(path, anchor, method + anchor)
          old = '''    # Records R1.2 implementation milestone\n    def save_record(self, value: BaseRecord) -> None:\n        try:\n            from portable_runtime.records.authorization import AuthorizationGrant\n            if isinstance(value, AuthorizationGrant):\n                self.save_authorization(value)\n                return\n        except Exception:\n            pass\n        from portable_runtime.protocol.validation import assert_semantic_mutation_authorized, validate_record_write\n        from portable_runtime.records.validation import validate_canonical_write\n\n        def validate() -> None:\n            existing = self.get_record(value.id)\n            errs = [*validate_record_write(value, existing), *validate_canonical_write(value)]\n            if errs:\n                raise ValueError("; ".join(errs))\n            assert_semantic_mutation_authorized(value, existing, self.export_state())\n\n        self._atomic_graph_save("record", value, validate)\n'''
          new = '''    # Records R1.2 implementation milestone\n    def _validate_record_write_semantics(self, value: BaseRecord) -> None:\n        from portable_runtime.protocol.validation import assert_semantic_mutation_authorized, validate_record_write\n        from portable_runtime.records.validation import validate_canonical_write\n\n        existing = self.get_record(value.id)\n        errs = [*validate_record_write(value, existing), *validate_canonical_write(value)]\n        if errs:\n            raise ValueError("; ".join(errs))\n        assert_semantic_mutation_authorized(value, existing, self.export_state())\n\n    def save_record(self, value: BaseRecord) -> None:\n        try:\n            from portable_runtime.records.authorization import AuthorizationGrant\n            if isinstance(value, AuthorizationGrant):\n                self.save_authorization(value)\n                return\n        except Exception:\n            pass\n        self._atomic_graph_save("record", value, lambda: self._validate_record_write_semantics(value))\n'''
          replace(path, old, new)
          replace(
              path,
              '        if value.type == "RecoveryApplicationRecorded" and self._recovery_application_commit_depth <= 0:\n            raise ValueError("RecoveryApplication events require commit_recovery_application")\n',
              '        if value.type == "RecoveryApplicationRecorded" and self._recovery_application_commit_depth <= 0:\n            raise ValueError("RecoveryApplication events require commit_recovery_application")\n        if value.type == "HistoricalExperienceUseRecorded" and self._historical_experience_use_commit_depth <= 0:\n            raise ValueError("HistoricalExperienceUse events require commit_historical_experience_use")\n',
          )
          replace(
              path,
              '    def import_state(self, state: dict[str, list[dict[str, object]]]) -> None:\n        with self._lock:',
              '    def import_state(self, state: dict[str, list[dict[str, object]]]) -> None:\n        from portable_runtime.experience.historical_use import assert_historical_experience_use_import_closed\n\n        assert_historical_experience_use_import_closed(state)\n        with self._lock:',
          )

          # Existing EUA-B structural test now sees the explicit semantic
          # contract version as a first-class result field.
          path = "tests/conformance/test_experience_use_admission.py"
          replace(
              path,
              '        "resolved_snapshot",\n        "reasons",',
              '        "resolved_snapshot",\n        "admission_contract_version",\n        "reasons",',
          )

          # EUA-C counterexamples graduate: current-state guards now expect the
          # production surface while preserving the no-DomainJudgment/no-bucket decisions.
          path = "tests/audit/test_eua_c_historical_use_judgment_binding_audit.py"
          replace(
              path,
              'from portable_runtime.experience.use_admission import ExperienceUseAdmission\n',
              'from portable_runtime.experience.historical_use import (\n    HISTORICAL_EXPERIENCE_USE_GRADUATED_COUNTEREXAMPLES,\n    HistoricalExperienceUse,\n)\nfrom portable_runtime.experience.use_admission import ExperienceUseAdmission\n',
          )
          replace(
              path,
              'def test_eua_c_006_no_store_owned_historical_experience_use_commit_exists() -> None:\n    source = inspect.getsource(InMemoryStateStore)\n    assert "commit_historical_experience_use" not in source\n    assert "commit_experience_use" not in source\n    assert "historical_experience_use" not in source\n',
              'def test_eua_c_006_store_owned_historical_experience_use_commit_now_exists() -> None:\n    source = inspect.getsource(InMemoryStateStore)\n    assert "commit_historical_experience_use" in source\n    assert "_historical_experience_use_commit_depth" in source\n',
          )
          replace(
              path,
              'def test_eua_c_007_no_durable_historical_experience_use_authority_type_exists() -> None:\n    root = Path("src/portable_runtime")\n    source = "\\n".join(path.read_text(encoding="utf-8") for path in root.rglob("*.py"))\n    assert "class HistoricalExperienceUseBinding" not in source\n    assert "class DomainJudgment" not in source\n',
              'def test_eua_c_007_typed_historical_authority_exists_without_new_domain_judgment_type() -> None:\n    root = Path("src/portable_runtime")\n    source = "\\n".join(path.read_text(encoding="utf-8") for path in root.rglob("*.py"))\n    assert HistoricalExperienceUse.__name__ == "HistoricalExperienceUse"\n    assert "class DomainJudgment" not in source\n',
          )
          old = '''@pytest.mark.parametrize(\n    ("case_id", "obligation"),\n    _HUB_COUNTEREXAMPLES,\n    ids=[item[0] for item in _HUB_COUNTEREXAMPLES],\n)\n@pytest.mark.xfail(strict=True, reason="EUA-C audit freeze; durable historical-use authority not implemented")\ndef test_eua_c_counterexamples_require_future_store_owned_historical_binding(\n    case_id: str,\n    obligation: str,\n) -> None:\n    raise AssertionError(f"{case_id}: {obligation}")\n'''
          new = '''@pytest.mark.parametrize(\n    ("case_id", "obligation"),\n    _HUB_COUNTEREXAMPLES,\n    ids=[item[0] for item in _HUB_COUNTEREXAMPLES],\n)\ndef test_eua_c_counterexamples_are_graduated_by_eua_d(\n    case_id: str,\n    obligation: str,\n) -> None:\n    assert obligation\n    assert case_id in HISTORICAL_EXPERIENCE_USE_GRADUATED_COUNTEREXAMPLES\n'''
          replace(path, old, new)

          # Strict conformance must run both the graduated audit and the new
          # EUA-D backend/atomicity tests.
          path = ".github/workflows/ci.yml"
          replace(
              path,
              '          tests/audit/test_eua_c_historical_use_judgment_binding_audit.py\n          tests/conformance/test_experience_use_admission.py',
              '          tests/audit/test_eua_c_historical_use_judgment_binding_audit.py\n          tests/conformance/test_experience_use_admission.py\n          tests/conformance/test_historical_experience_use.py',
          )

          # Remove this one-shot integration workflow from the resulting tree.
          Path(".github/workflows/eua-d-apply.yml").unlink()
          PY
          git config user.name "EUA-D integration"
          git config user.email "80614539+xiongweilin@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "EUA-D: integrate store-owned historical use [eua-d-patched]"
          git push origin HEAD:feat/historical-experience-use
