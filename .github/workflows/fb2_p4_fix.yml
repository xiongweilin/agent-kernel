name: FB2 P4 Fix
on:
  push:
    branches: [feat/verified-outcome-authority-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - shell: python
        run: |
          from pathlib import Path
          p = Path('src/portable_runtime/interfaces/store.py')
          s = p.read_text()
          s = s.replace(
              'from portable_runtime.records.models import BaseRecord, OutcomeRecord\nfrom portable_runtime.records.verified_outcome_commit import VerifiedOutcomeCommitRequest\nfrom portable_runtime.records.relations import RecordRelation\n',
              'from portable_runtime.records.models import BaseRecord, OutcomeRecord\nfrom portable_runtime.records.relations import RecordRelation\nfrom portable_runtime.records.verified_outcome_commit import VerifiedOutcomeCommitRequest\n',
          )
          p.write_text(s)
          p = Path('src/portable_runtime/stores/memory.py')
          s = p.read_text()
          s = s.replace(
              'from portable_runtime.records.models import BaseRecord, EvidenceArtifact\n',
              'from portable_runtime.records.models import BaseRecord, EvidenceArtifact, OutcomeRecord\n',
              1,
          )
          p.write_text(s)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/interfaces/store.py src/portable_runtime/stores/memory.py
          git commit -m "fix: complete verified outcome store typing"
          git push