name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv (cached)
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Mypy (src)
        run: uv run mypy src
      - name: Pytest
        run: uv run pytest

  strict-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv (cached)
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --extra dev
      - name: Verify canonical contracts are packaged in the wheel
        run: |
          rm -rf dist-contract-check
          uv build --wheel --out-dir dist-contract-check
          uv run python - <<'PY'
          import glob
          import tomllib
          import zipfile

          wheels = glob.glob("dist-contract-check/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as archive:
              name = "portable_runtime/_contracts/catalog.toml"
              assert name in archive.namelist(), "canonical contract catalog missing from wheel"
              catalog = tomllib.loads(archive.read(name).decode("utf-8"))
              assert catalog["owner"] == "portable-runtime/contracts"
              assert catalog["catalog_version"] == "portable-runtime-contracts-v1"
          PY
      - name: Public contract canonicalization oracle
        run: uv run python -m portable_runtime.public_contracts.vectors
      - name: Strict conformance
        run: >-
          uv run pytest -q
          tests/conformance/public_contracts
          tests/conformance/test_semantic_separation_convergence.py
          tests/conformance/test_boundary_architecture.py
          tests/conformance/test_execution_outcome_separation.py
          tests/conformance/test_verified_outcome_authority.py
          tests/conformance/test_verified_outcome_commit.py
          tests/conformance/test_verified_outcome_import_replay.py
          tests/conformance/test_verified_outcome_import_integration.py
          tests/conformance/test_bound_verification_evidence.py
          tests/conformance/test_action_read_seam.py
          tests/conformance/test_outcome_governance_impact_design.py
          tests/conformance/test_outcome_confirmed_trigger_resolution.py
          tests/conformance/test_outcome_governance_applicability.py
          tests/conformance/test_outcome_impact_judgment.py
          tests/conformance/test_outcome_impact_commit.py
          tests/conformance/test_outcome_governance_impact_lifecycle.py
          tests/conformance/test_outcome_impact_import_guard.py
          tests/conformance/test_recovery_terminal_closure_design.py
          tests/conformance/test_recovery_observation_authority.py
          tests/conformance/test_provider_execution_binding.py
          tests/conformance/test_reconciliation_repeatability_authority.py
          tests/audit/test_b4_p2_objective_bridge_design.py
          tests/audit/test_b4_p3_recovery_disposition_design.py
          tests/audit/test_b4_p4_recovery_application_design.py
          tests/audit/test_b4_durable_invocation_specification_design.py
          tests/audit/test_b4_provider_visible_request_partition_design.py
          tests/audit/test_b4_retry_exact_provider_pin_design.py
          tests/audit/test_b4_durable_invocation_specification_production_freeze.py
          tests/audit/test_b4_recovery_reconciliation_consumption_design.py
          tests/audit/test_b4_reconciliation_consumer_counterexample_freeze.py
          tests/audit/test_b4_recovery_observation_application_binding_design.py
          tests/audit/test_b4_reconciliation_repeatability_design.py
          tests/audit/test_b4_configured_provider_reconciliation_target_design.py
          tests/audit/test_b4_reconciliation_substrate_production_freeze.py
          tests/audit/test_eua_a_experience_use_authority_audit.py
          tests/audit/test_eua_c_historical_use_judgment_binding_audit.py
          tests/conformance/test_experience_use_admission.py
          tests/conformance/test_experience_use_snapshot_coherence.py
          tests/conformance/test_historical_experience_use.py
          tests/conformance/test_recovery_application_authority.py
          tests/conformance/test_recovery_disposition_counterexamples.py
          tests/conformance/test_recovery_disposition_preparation.py
          tests/conformance/test_recovery_disposition_commit.py
          tests/conformance/test_responsibility_separation_contracts.py
          tests/conformance/test_distinction_governance.py
          tests/conformance/test_distinction_governance_persistence.py
          tests/conformance/test_governance_persistence_determinism.py
          tests/conformance/test_distinction_governance_revalidation.py
          tests/conformance/test_distinction_governance_revalidation_hardening.py
          tests/conformance/test_distinction_governance_canonical_hardening.py
          tests/conformance/test_distinction_governance_bundle_portability.py
          tests/conformance/test_governance_use_admission.py
          tests/conformance/test_governance_permit_binding.py
          tests/conformance/test_governance_dispatch_linearization.py
          tests/conformance/test_governance_dispatch_atomicity.py
          tests/conformance/test_qualification_transition.py
          tests/conformance/test_terminal_authority.py
          tests/conformance/test_authoritative.py
          tests/conformance/test_sqlite_atomicity.py
          tests/conformance/test_p1_semantic.py
          tests/conformance/test_semantic_authority_closure.py
          tests/conformance/test_revision_authority.py
          tests/conformance/test_p2_protocol.py
          tests/test_p1_routing.py
          tests/test_reliability_controls_p2.py

  public-contract-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Node workspace
        run: npm ci
      - name: Typecheck TypeScript contract client
        run: npm run typecheck --workspace=@portable-runtime/contracts-client
      - name: TypeScript public-contract conformance
        run: npm run conformance --workspace=@portable-runtime/contracts-client
      - name: Typecheck Responsibility Inspector
        run: npm run typecheck --workspace=@portable-runtime/responsibility-inspector
      - name: Build Responsibility Inspector
        run: npm run build --workspace=@portable-runtime/responsibility-inspector

  sonarcloud:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [lint-and-test, strict-conformance, public-contract-consumers]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv (cached)
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --locked --extra dev
      - name: Generate coverage for SonarCloud
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term --junitxml=pytest-junit.xml
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
