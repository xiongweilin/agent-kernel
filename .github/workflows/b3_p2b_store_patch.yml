name: B3 P2b Store Patch
on:
  push:
    branches: [feat/outcome-governance-impact-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - shell: python
        run: |
          from pathlib import Path

          memory = Path('src/portable_runtime/stores/memory.py')
          text = memory.read_text()
          text = text.replace(
              '        self._terminal_commit_depth = 0\n',
              '        self._terminal_commit_depth = 0\n        self._outcome_impact_commit_depth = 0\n',
              1,
          )
          anchor = '''    def _validate_candidate_write(self, kind: str, value: BaseModel) -> None:\n'''
          method = '''    def commit_outcome_impact_judgment(self, request: Any, impact_policy: Any, disposition_policy: Any) -> Any:\n        \"\"\"Atomically commit or replay one durable Outcome governance judgment.\"\"\"\n        from portable_runtime.governance.outcome_impact_commit import (\n            committed_outcome_impact,\n            prepare_outcome_impact_commit,\n        )\n\n        with self.transaction():\n            prepared = prepare_outcome_impact_commit(self, request, impact_policy, disposition_policy)\n            if prepared.replayed:\n                return committed_outcome_impact(prepared)\n            self._outcome_impact_commit_depth += 1\n            try:\n                for event in prepared.events:\n                    self.append_event(event)\n            finally:\n                self._outcome_impact_commit_depth -= 1\n            return committed_outcome_impact(prepared)\n\n'''
          if method not in text:
              if anchor not in text:
                  raise SystemExit('memory method anchor missing')
              text = text.replace(anchor, method + anchor, 1)
          guard_anchor = '''    def append_event(self, value: Event) -> None:\n        with self._lock:\n'''
          guard = '''    def append_event(self, value: Event) -> None:\n        from portable_runtime.governance.outcome_impact_commit import OUTCOME_IMPACT_AUTHORITY_EVENT_TYPES\n\n        if value.type in OUTCOME_IMPACT_AUTHORITY_EVENT_TYPES and self._outcome_impact_commit_depth <= 0:\n            raise ValueError(\"Outcome impact authority events require commit_outcome_impact_judgment\")\n        with self._lock:\n'''
          if guard not in text:
              if guard_anchor not in text:
                  raise SystemExit('memory append anchor missing')
              text = text.replace(guard_anchor, guard, 1)
          memory.write_text(text)

          sqlite = Path('src/portable_runtime/stores/sqlite.py')
          text = sqlite.read_text()
          text = text.replace(
              '        self._terminal_commit_depth = 0\n',
              '        self._terminal_commit_depth = 0\n        self._outcome_impact_commit_depth = 0\n',
              1,
          )
          anchor = '''    def _validate_candidate_write(self, kind: str, value: Any) -> None:\n'''
          method = '''    def commit_outcome_impact_judgment(self, request: Any, impact_policy: Any, disposition_policy: Any) -> Any:\n        \"\"\"Writer-serialized commit/replay of one durable Outcome governance judgment.\"\"\"\n        from portable_runtime.governance.outcome_impact_commit import (\n            committed_outcome_impact,\n            prepare_outcome_impact_commit,\n        )\n\n        with self._lock:\n            owns_transaction = not self._connection.in_transaction\n            if owns_transaction:\n                self._connection.execute(\"BEGIN IMMEDIATE\")\n            try:\n                prepared = prepare_outcome_impact_commit(self, request, impact_policy, disposition_policy)\n                if not prepared.replayed:\n                    self._outcome_impact_commit_depth += 1\n                    try:\n                        for event in prepared.events:\n                            self.append_event(event)\n                    finally:\n                        self._outcome_impact_commit_depth -= 1\n                if owns_transaction:\n                    self._connection.execute(\"COMMIT\")\n                return committed_outcome_impact(prepared)\n            except Exception:\n                if owns_transaction:\n                    self._rollback(self._connection.cursor())\n                raise\n\n'''
          if method not in text:
              if anchor not in text:
                  raise SystemExit('sqlite method anchor missing')
              text = text.replace(anchor, method + anchor, 1)
          guard_anchor = '''    def append_event(self, value: Event) -> None:\n        existing = self._get(\"event\", Event, value.id)\n'''
          guard = '''    def append_event(self, value: Event) -> None:\n        from portable_runtime.governance.outcome_impact_commit import OUTCOME_IMPACT_AUTHORITY_EVENT_TYPES\n\n        if value.type in OUTCOME_IMPACT_AUTHORITY_EVENT_TYPES and self._outcome_impact_commit_depth <= 0:\n            raise ValueError(\"Outcome impact authority events require commit_outcome_impact_judgment\")\n        existing = self._get(\"event\", Event, value.id)\n'''
          if guard not in text:
              if guard_anchor not in text:
                  raise SystemExit('sqlite append anchor missing')
              text = text.replace(guard_anchor, guard, 1)
          sqlite.write_text(text)
      - shell: bash
        run: |
          rm .github/workflows/b3_p2b_store_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/stores/memory.py src/portable_runtime/stores/sqlite.py .github/workflows/b3_p2b_store_patch.yml
          git commit -m "B3-P2b: own durable impact commits in StateStore"
          git push
