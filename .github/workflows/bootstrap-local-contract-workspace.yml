name: Bootstrap local contract workspace

on:
  push:
    branches:
      - contracts-local-canonical

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-done]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove legacy source pin and generate workspace lock
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/portable_runtime/governance/distinction.py')
          text = path.read_text(encoding='utf-8')
          legacy = 'DISTINCTION_GOVERNANCE_SOURCE_COMMIT = "ef9e490987ed47ebef3ac455851109304f24a97c"'
          replacement = 'DISTINCTION_GOVERNANCE_CONTRACT_ID = "distinction-governance"'
          if legacy in text:
              text = text.replace(legacy, replacement)
              path.write_text(text, encoding='utf-8')
          elif replacement not in text:
              raise SystemExit('distinction contract identity was not found')
          PY
          npm install --package-lock-only --ignore-scripts
      - name: Commit generated lock and compiled local identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json src/portable_runtime/governance/distinction.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize local contract bootstrap [bootstrap-done]"
          git push origin HEAD:contracts-local-canonical
