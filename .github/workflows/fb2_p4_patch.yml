name: FB2 P4 Patch
on:
  push:
    branches: [feat/verified-outcome-authority-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - shell: python
        run: |
          from pathlib import Path

          p = Path('src/portable_runtime/interfaces/store.py')
          s = p.read_text()
          anchor = 'from portable_runtime.records.models import BaseRecord\n'
          imp = 'from portable_runtime.records.verified_outcome_commit import VerifiedOutcomeCommitRequest\n'
          if imp not in s:
              s = s.replace(anchor, anchor + imp, 1)
          anchor = '    def commit_terminal(self, work: Work, run: Run, verification_refs: list[str]) -> Run: ...\n'
          addition = anchor + '    def commit_verified_outcome(self, request: VerifiedOutcomeCommitRequest) -> BaseRecord: ...\n'
          if 'def commit_verified_outcome' not in s:
              s = s.replace(anchor, addition, 1)
          p.write_text(s)

          for name, sqlite in [('src/portable_runtime/stores/memory.py', False), ('src/portable_runtime/stores/sqlite.py', True)]:
              p = Path(name)
              s = p.read_text()
              anchor = '    def _validate_candidate_write(self, kind: str, value: Any) -> None:\n'
              if not sqlite:
                  anchor = '    def _validate_candidate_write(self, kind: str, value: BaseModel) -> None:\n'
              method = '''    def commit_verified_outcome(self, request: Any) -> BaseRecord:\n        """Atomically commit one verification-authorized confirmed Outcome."""\n        from portable_runtime.records.verified_outcome_commit import (\n            prepare_verified_outcome_commit,\n            same_verified_outcome_semantics,\n        )\n\n        with self.transaction():\n            prepared = prepare_verified_outcome_commit(self, request)\n            existing = self.get_record(prepared.outcome.id)\n            if existing is not None:\n                if not same_verified_outcome_semantics(existing, prepared.outcome):\n                    raise ValueError("verified-outcome deterministic identity rebound")\n                for event in prepared.events:\n                    persisted = self.get_event(event.id)\n                    if persisted is None or not same_verified_outcome_semantics(persisted, event):\n                        raise ValueError("verified-outcome authority event graph incomplete")\n                return existing\n            self._save("record", prepared.outcome)\n            for event in prepared.events:\n                self.append_event(event)\n            return prepared.outcome\n\n'''
              if 'def commit_verified_outcome' not in s:
                  if anchor not in s: raise SystemExit(f'anchor missing {name}')
                  s = s.replace(anchor, method + anchor, 1)
              p.write_text(s)
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/interfaces/store.py src/portable_runtime/stores/memory.py src/portable_runtime/stores/sqlite.py
          git commit -m "feat: add atomic verified outcome commit primitive"
          git push