name: Fix ActionAuthority contract registry provenance

on:
  push:
    branches: [codex/second-admin-capability]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/second-admin-capability
      - name: Preserve Runtime contracts at ActionAuthority
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          path = "src/portable_runtime/responsibility/domain_effect_action_authority.py"
          replace(
              path,
              "from portable_runtime.core.capabilities import CapabilityRequest\n",
              "from portable_runtime.core.capabilities import CapabilityRequest\nfrom portable_runtime.core.capability_contract import CapabilityContractRegistry\n",
          )
          replace(
              path,
              '''    def __init__(\n        self,\n        store: Any,\n        provider_registry: ProviderRegistry,\n        *,\n        now: Callable[[], datetime] = utcnow,\n    ) -> None:\n        self.store = store\n        self.provider_registry = provider_registry\n        self.now = now\n''',
              '''    def __init__(\n        self,\n        store: Any,\n        provider_registry: ProviderRegistry,\n        *,\n        contract_registry: CapabilityContractRegistry | None = None,\n        now: Callable[[], datetime] = utcnow,\n    ) -> None:\n        self.store = store\n        self.provider_registry = provider_registry\n        self.contract_registry = contract_registry or CapabilityContractRegistry()\n        self.authorization = DomainEffectAuthorizationUseConsumption(\n            store,\n            contract_registry=self.contract_registry,\n        )\n        self.now = now\n''',
          )
          replace(
              path,
              '''        context = DomainEffectAuthorizationUseConsumption(self.store)._resolve_context(\n            authorization_ref\n        )\n''',
              '''        context = self.authorization._resolve_context(authorization_ref)\n''',
          )
          replace(
              path,
              '''            consumer = DomainEffectAuthorizationUseConsumption(self.store)\n            context = consumer._resolve_context(authorization_ref)\n''',
              '''            context = self.authorization._resolve_context(authorization_ref)\n''',
          )

          replace(
              "src/portable_runtime/public_contracts/domain_effect.py",
              '''            DomainEffectActionAuthorityResolver(\n                self.runtime.store,\n                self.runtime.registry,\n            ),\n''',
              '''            DomainEffectActionAuthorityResolver(\n                self.runtime.store,\n                self.runtime.registry,\n                contract_registry=self.runtime.contract_registry,\n            ),\n''',
          )

          # Ruff import order in qualification: capabilities sorts before capability_contract.
          qpath = "src/portable_runtime/responsibility/domain_effect_qualification.py"
          replace(
              qpath,
              '''from portable_runtime.core.capability_contract import CapabilityContractRegistry\nfrom portable_runtime.core.capabilities import CapabilityRequest\n''',
              '''from portable_runtime.core.capabilities import CapabilityRequest\nfrom portable_runtime.core.capability_contract import CapabilityContractRegistry\n''',
          )

          Path(".github/workflows/fix-action-authority-contract-registry.yml").unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve capability contract authority at ActionBoundary"
          git push origin HEAD:codex/second-admin-capability
