name: Apply responsibility contracts P1-P4

on:
  push:
    branches:
      - codex/responsibility-contracts-p1-p4
    paths:
      - tools/apply_responsibility_contracts_p1_p4.py
      - .github/workflows/apply-responsibility-contracts.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_responsibility_contracts_p1_p4.py
      - .github/workflows/apply-responsibility-contracts.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: codex/responsibility-contracts-p1-p4

      - name: Apply P1-P4 patches
        run: |
          python tools/apply_responsibility_contracts_p1_p4.py
          git rm tools/apply_responsibility_contracts_p1_p4.py
          git rm .github/workflows/apply-responsibility-contracts.yml

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

      - name: Commit verified rollout
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: harden responsibility separation contracts"
          git push origin HEAD:codex/responsibility-contracts-p1-p4
