name: Apply responsibility contracts P1-P4

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_responsibility_contracts_p1_p4.py
      - .github/workflows/apply-responsibility-contracts.yml

permissions:
  contents: read

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: codex/responsibility-contracts-p1-p4

      - name: Apply P1-P4 patches
        run: |
          python tools/apply_responsibility_contracts_p1_p4.py
          git rm tools/apply_responsibility_contracts_p1_p4.py
          git rm .github/workflows/apply-responsibility-contracts.yml

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

      - name: Pack verified tree
        run: |
          rm -rf .venv .pytest_cache .mypy_cache .ruff_cache
          tar --exclude=.git -czf /tmp/responsibility-rollout.tar.gz .

      - name: Upload verified tree
        uses: actions/upload-artifact@v4
        with:
          name: responsibility-rollout
          path: /tmp/responsibility-rollout.tar.gz
          if-no-files-found: error
          retention-days: 1
