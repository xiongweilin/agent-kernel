name: Apply responsibility contracts P1-P4

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/apply_responsibility_contracts_p1_p4.py
      - .github/workflows/apply-responsibility-contracts.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: codex/responsibility-contracts-p1-p4

      - name: Apply P1-P4 patches
        run: |
          python tools/apply_responsibility_contracts_p1_p4.py
          cp tools/apply_responsibility_contracts_p1_p4.py /tmp/apply_responsibility_contracts_p1_p4.py
          cp .github/workflows/apply-responsibility-contracts.yml /tmp/apply-responsibility-contracts.yml
          rm tools/apply_responsibility_contracts_p1_p4.py
          rm .github/workflows/apply-responsibility-contracts.yml
          git restore --source=HEAD -- .github/workflows/ci.yml

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

      - name: Restore temporary branch files
        run: |
          mkdir -p tools .github/workflows
          cp /tmp/apply_responsibility_contracts_p1_p4.py tools/apply_responsibility_contracts_p1_p4.py
          cp /tmp/apply-responsibility-contracts.yml .github/workflows/apply-responsibility-contracts.yml

      - name: Commit verified product rollout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no product changes to commit"; exit 1; }
          git diff --cached --name-only | grep -v '^\.github/workflows/' >/dev/null
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "refusing to push workflow changes with the Actions token"
            exit 1
          fi
          git commit -m "feat: harden responsibility separation contracts"
          git push origin HEAD:codex/responsibility-contracts-p1-p4
