name: FB2 P5 Import Patch
on:
  push:
    branches: [feat/verified-outcome-authority-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - shell: python
        run: |
          from pathlib import Path

          for name in [
              'src/portable_runtime/stores/memory.py',
              'src/portable_runtime/stores/sqlite.py',
          ]:
              p = Path(name)
              s = p.read_text()
              anchor = '''            assert_valid_state_transition(current, candidate, prepared)\n            assert_valid_state_graph(candidate)\n'''
              addition = anchor + '''            from portable_runtime.records.verified_outcome_replay import (\n                validate_verified_outcome_authority_graph,\n            )\n\n            validate_verified_outcome_authority_graph(candidate)\n'''
              if 'validate_verified_outcome_authority_graph(candidate)' not in s:
                  if anchor not in s:
                      raise SystemExit(f'import validation anchor missing in {name}')
                  s = s.replace(anchor, addition, 1)
              p.write_text(s)
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/stores/memory.py src/portable_runtime/stores/sqlite.py
          git commit -m "feat: replay verified outcome authority before import"
          git push