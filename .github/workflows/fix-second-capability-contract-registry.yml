name: Fix second capability contract registry propagation

on:
  push:
    branches: [codex/second-admin-capability]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/second-admin-capability
      - name: Propagate Runtime contract registry through request preparation
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "src/portable_runtime/responsibility/domain_effect_request.py",
              "from portable_runtime.core.capabilities import CapabilityRequest\n",
              "from portable_runtime.core.capabilities import CapabilityRequest\nfrom portable_runtime.core.capability_contract import CapabilityContractRegistry\n",
          )
          replace(
              "src/portable_runtime/responsibility/domain_effect_request.py",
              '''    def __init__(self, store: Any) -> None:\n        self.store = store\n        self.authorization = DomainEffectAuthorizationUseConsumption(store)\n''',
              '''    def __init__(\n        self,\n        store: Any,\n        *,\n        contract_registry: CapabilityContractRegistry | None = None,\n    ) -> None:\n        self.store = store\n        self.contract_registry = contract_registry or CapabilityContractRegistry()\n        self.authorization = DomainEffectAuthorizationUseConsumption(\n            store,\n            contract_registry=self.contract_registry,\n        )\n''',
          )
          replace(
              "src/portable_runtime/public_contracts/domain_effect.py",
              '''            prepared_request = DomainEffectExecutionRequestPreparation(self.runtime.store).prepare(\n                DomainEffectExecutionRequestPreparationInput(run_ref=run_result.run_ref),\n                prepared_at=at,\n            ).request\n''',
              '''            prepared_request = DomainEffectExecutionRequestPreparation(\n                self.runtime.store,\n                contract_registry=self.runtime.contract_registry,\n            ).prepare(\n                DomainEffectExecutionRequestPreparationInput(run_ref=run_result.run_ref),\n                prepared_at=at,\n            ).request\n''',
          )
          Path(".github/workflows/fix-second-capability-contract-registry.yml").unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Propagate runtime capability contracts through request preparation"
          git push origin HEAD:codex/second-admin-capability
