name: Apply second administrative capability patch

on:
  push:
    branches: [codex/second-admin-capability]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/second-admin-capability
          fetch-depth: 0
      - name: Apply bounded-domain-effect generalization
        shell: python
        run: |
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "src/portable_runtime/responsibility/domain_effect_authorization.py",
              '''        if context.intent.capability != ADMINISTRATIVE_HRIS_EMPLOYEE_CREATE:\n            return DomainEffectAuthorizationJudgment(\n                False,\n                "capability is outside the bounded administrative authorization slice",\n            )\n''',
              '''        # Capability identity is already derived from the responsibility\n        # target/operation and must resolve through an explicit runtime contract.\n        # Do not hard-code a domain capability here: boundedness is established\n        # by the current contract plus the server-owned execution profile.\n''',
          )
          replace(
              "src/portable_runtime/responsibility/domain_effect_authorization.py",
              '"""Kernel-owned bounded policy for the first administrative cutover slice."""',
              '"""Kernel-owned bounded policy for explicitly contracted administrative effects."""',
          )

          replace(
              "src/portable_runtime/responsibility/domain_effect_authorization_use.py",
              '''    ADMINISTRATIVE_HRIS_EMPLOYEE_CREATE,\n''',
              '',
          )
          replace(
              "src/portable_runtime/responsibility/domain_effect_authorization_use.py",
              '''        if intent.capability != ADMINISTRATIVE_HRIS_EMPLOYEE_CREATE:\n            raise ValueError("capability is outside the bounded authorization-use slice")\n''',
              '',
          )

          replace(
              "src/portable_runtime/responsibility/domain_effect_verified_outcome.py",
              '''DOMAIN_EFFECT_VERIFICATION_CAPABILITY = (\n    f"verify.{ADMINISTRATIVE_HRIS_EMPLOYEE_CREATE}"\n)\n''',
              '''def domain_effect_verification_capability(effect_capability: str) -> str:\n    value = effect_capability.strip()\n    if not value:\n        raise ValueError("domain effect verification requires a capability")\n    return f"verify.{value}"\n\n\nDOMAIN_EFFECT_VERIFICATION_CAPABILITY = domain_effect_verification_capability(\n    ADMINISTRATIVE_HRIS_EMPLOYEE_CREATE\n)\n''',
          )
          replace(
              "src/portable_runtime/responsibility/domain_effect_verified_outcome.py",
              '''        if request.capability != ADMINISTRATIVE_HRIS_EMPLOYEE_CREATE:\n            raise ValueError("capability is outside the bounded verified-outcome slice")\n''',
              '',
          )
          replace(
              "src/portable_runtime/responsibility/domain_effect_verified_outcome.py",
              '''            DOMAIN_EFFECT_VERIFICATION_CAPABILITY,\n            work_id=graph.work.id,\n''',
              '''            domain_effect_verification_capability(effect_request.capability),\n            work_id=graph.work.id,\n''',
          )
          replace(
              "src/portable_runtime/responsibility/domain_effect_verified_outcome.py",
              '''    "DOMAIN_EFFECT_VERIFICATION_EVIDENCE_SCHEMA",\n''',
              '''    "DOMAIN_EFFECT_VERIFICATION_EVIDENCE_SCHEMA",\n    "domain_effect_verification_capability",\n''',
          )

          replace(
              "src/portable_runtime/responsibility/domain_effect_terminal_completion.py",
              '''from portable_runtime.responsibility.domain_effect_authorization import (\n    ADMINISTRATIVE_HRIS_EMPLOYEE_CREATE,\n)\n''',
              '',
          )
          replace(
              "src/portable_runtime/responsibility/domain_effect_terminal_completion.py",
              '''        if action.capability != ADMINISTRATIVE_HRIS_EMPLOYEE_CREATE:\n            raise ValueError("Outcome Action is outside the bounded administrative completion slice")\n''',
              '',
          )
          replace(
              "src/portable_runtime/responsibility/domain_effect_terminal_completion.py",
              '''        authorization = self.authorization._resolve_context(authorization_ref)\n        contract, contract_digest = require_domain_effect_completion_contract(\n''',
              '''        authorization = self.authorization._resolve_context(authorization_ref)\n        if action.capability != authorization.intent.capability:\n            raise ValueError("Outcome Action capability drifted from runtime authorization")\n        contract, contract_digest = require_domain_effect_completion_contract(\n''',
          )

          replace(
              "src/portable_runtime/responsibility/domain_effect_responsibility_reassessment.py",
              '''from portable_runtime.responsibility.domain_effect_authorization import (\n    ADMINISTRATIVE_HRIS_EMPLOYEE_CREATE,\n)\n''',
              '',
          )
          replace(
              "src/portable_runtime/responsibility/domain_effect_responsibility_reassessment.py",
              '''        if action.capability != ADMINISTRATIVE_HRIS_EMPLOYEE_CREATE:\n            raise ValueError("Outcome Action is outside the bounded reassessment slice")\n''',
              '',
          )
          replace(
              "src/portable_runtime/responsibility/domain_effect_responsibility_reassessment.py",
              '''        authorization = self.authorization._resolve_context(authorization_ref)\n        contract, contract_digest = require_domain_effect_completion_contract(work, authorization)\n''',
              '''        authorization = self.authorization._resolve_context(authorization_ref)\n        if action.capability != authorization.intent.capability:\n            raise ValueError("Outcome Action capability drifted from runtime authorization")\n        contract, contract_digest = require_domain_effect_completion_contract(work, authorization)\n''',
          )

          Path(".github/workflows/apply-second-admin-capability.yml").unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generalize bounded domain-effect runtime beyond HRIS"
          git push origin HEAD:codex/second-admin-capability
