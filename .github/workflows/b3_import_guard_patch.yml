name: B3 Impact Import Guard Patch
on:
  push:
    branches: [feat/outcome-governance-impact-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - shell: python
        run: |
          from pathlib import Path

          memory = Path('src/portable_runtime/stores/memory.py')
          text = memory.read_text()
          anchor = '''            candidate = {\n                kind: [value.model_dump(mode="json") for value in values.values()]\n                for kind, values in self._records.items()\n            }\n'''
          guard = '''            from portable_runtime.governance.outcome_impact_commit import (\n                OUTCOME_IMPACT_AUTHORITY_EVENT_TYPES,\n            )\n\n            if any(\n                getattr(event, "type", "") in OUTCOME_IMPACT_AUTHORITY_EVENT_TYPES\n                for event in prepared.get("event", ())\n            ):\n                raise ValueError(\n                    "B3 outcome impact authority history import is unsupported; "\n                    "durable impact authority must be created by commit_outcome_impact_judgment"\n                )\n            candidate = {\n                kind: [value.model_dump(mode="json") for value in values.values()]\n                for kind, values in self._records.items()\n            }\n'''
          if guard not in text:
              if anchor not in text:
                  raise SystemExit('memory import guard anchor missing')
              text = text.replace(anchor, guard, 1)
          memory.write_text(text)

          sqlite = Path('src/portable_runtime/stores/sqlite.py')
          text = sqlite.read_text()
          anchor = '''                from portable_runtime.protocol.validation import (\n                    assert_valid_state_graph,\n                    assert_valid_state_transition,\n                )\n'''
          guard = '''                from portable_runtime.governance.outcome_impact_commit import (\n                    OUTCOME_IMPACT_AUTHORITY_EVENT_TYPES,\n                )\n\n                if any(\n                    getattr(event, "type", "") in OUTCOME_IMPACT_AUTHORITY_EVENT_TYPES\n                    for event in prepared.get("event", ())\n                ):\n                    raise ValueError(\n                        "B3 outcome impact authority history import is unsupported; "\n                        "durable impact authority must be created by commit_outcome_impact_judgment"\n                    )\n                from portable_runtime.protocol.validation import (\n                    assert_valid_state_graph,\n                    assert_valid_state_transition,\n                )\n'''
          if guard not in text:
              if anchor not in text:
                  raise SystemExit('sqlite import guard anchor missing')
              text = text.replace(anchor, guard, 1)
          sqlite.write_text(text)
      - shell: bash
        run: |
          rm .github/workflows/b3_import_guard_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/stores/memory.py src/portable_runtime/stores/sqlite.py .github/workflows/b3_import_guard_patch.yml
          git commit -m "B3-P3: fail closed on imported impact authority history"
          git push
