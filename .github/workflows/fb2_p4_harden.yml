name: FB2 P4 Harden
on:
  push:
    branches: [feat/verified-outcome-authority-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - shell: python
        run: |
          from pathlib import Path

          p = Path('src/portable_runtime/interfaces/store.py')
          s = p.read_text()
          s = s.replace('from portable_runtime.records.models import BaseRecord\n', 'from portable_runtime.records.models import BaseRecord, OutcomeRecord\n', 1)
          s = s.replace('def commit_verified_outcome(self, request: VerifiedOutcomeCommitRequest) -> BaseRecord:', 'def commit_verified_outcome(self, request: VerifiedOutcomeCommitRequest) -> OutcomeRecord:', 1)
          p.write_text(s)

          p = Path('src/portable_runtime/stores/memory.py')
          s = p.read_text()
          if 'OutcomeRecord' not in s.split('from portable_runtime.records.models import', 1)[1].split(')',1)[0]:
              s = s.replace('    Observation,\n', '    Observation,\n    OutcomeRecord,\n', 1)
          s = s.replace('def commit_verified_outcome(self, request: Any) -> BaseRecord:', 'def commit_verified_outcome(self, request: Any) -> OutcomeRecord:', 1)
          s = s.replace('                return existing\n            self._save("record", prepared.outcome)', '                if not isinstance(existing, OutcomeRecord):\n                    raise ValueError("verified-outcome identity does not resolve to OutcomeRecord")\n                return existing\n            self._save("record", prepared.outcome)', 1)
          p.write_text(s)

          p = Path('src/portable_runtime/stores/sqlite.py')
          s = p.read_text()
          old_start = s.index('    def commit_verified_outcome(self, request: Any) -> BaseRecord:\n')
          old_end = s.index('    def _validate_candidate_write', old_start)
          new = '''    def commit_verified_outcome(self, request: Any) -> OutcomeRecord:\n        """Atomically commit one verification-authorized confirmed Outcome."""\n        from portable_runtime.records.verified_outcome_commit import (\n            prepare_verified_outcome_commit,\n            same_verified_outcome_semantics,\n        )\n\n        with self._lock:\n            owns_transaction = not self._connection.in_transaction\n            if owns_transaction:\n                self._connection.execute("BEGIN IMMEDIATE")\n            try:\n                prepared = prepare_verified_outcome_commit(self, request)\n                existing = self.get_record(prepared.outcome.id)\n                if existing is not None:\n                    if not same_verified_outcome_semantics(existing, prepared.outcome):\n                        raise ValueError("verified-outcome deterministic identity rebound")\n                    for event in prepared.events:\n                        persisted = self.get_event(event.id)\n                        if persisted is None or not same_verified_outcome_semantics(persisted, event):\n                            raise ValueError("verified-outcome authority event graph incomplete")\n                    if not isinstance(existing, OutcomeRecord):\n                        raise ValueError("verified-outcome identity does not resolve to OutcomeRecord")\n                    if owns_transaction:\n                        self._connection.execute("COMMIT")\n                    return existing\n                self._save("record", prepared.outcome)\n                for event in prepared.events:\n                    self.append_event(event)\n                if owns_transaction:\n                    self._connection.execute("COMMIT")\n                return prepared.outcome\n            except Exception:\n                if owns_transaction:\n                    self._rollback(self._connection.cursor())\n                raise\n\n'''
          s = s[:old_start] + new + s[old_end:]
          p.write_text(s)
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/interfaces/store.py src/portable_runtime/stores/memory.py src/portable_runtime/stores/sqlite.py
          git commit -m "fix: harden verified outcome authority transaction"
          git push