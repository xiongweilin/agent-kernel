name: FB2 P2 Patch
on:
  push:
    branches: [feat/verified-outcome-authority-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - shell: python
        run: |
          from pathlib import Path
          p = Path('src/portable_runtime/records/validation.py')
          s = p.read_text()
          old = '''    extra = getattr(record, "model_extra", None) or {}\n    if extra:\n        return [\n            "canonical record writes forbid undeclared fields: "\n            + ", ".join(sorted(str(key) for key in extra))\n        ]\n    return []\n'''
          new = '''    errors: list[str] = []\n    extra = getattr(record, "model_extra", None) or {}\n    if extra:\n        errors.append(\n            "canonical record writes forbid undeclared fields: "\n            + ", ".join(sorted(str(key) for key in extra))\n        )\n    if record.record_type == "Outcome" and record.lifecycle_status == "confirmed":\n        errors.append(\n            "confirmed Outcome requires verified-outcome authority commit"\n        )\n    return errors\n'''
          if new not in s:
              if old not in s: raise SystemExit('validation anchor missing')
              p.write_text(s.replace(old, new, 1))
          t = Path('tests/conformance/test_verified_outcome_authority.py')
          s = t.read_text()
          marker = '@_xfail("FB2-A01: direct confirmed Outcome writes are not denied yet")\n'
          if marker in s:
              t.write_text(s.replace(marker, '', 1))
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/records/validation.py tests/conformance/test_verified_outcome_authority.py
          git commit -m "feat: deny direct confirmed outcome writes"
          git push