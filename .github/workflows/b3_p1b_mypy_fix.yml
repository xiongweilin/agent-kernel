name: B3 P1b Mypy Fix
on:
  push:
    branches: [feat/outcome-governance-impact-impl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - shell: python
        run: |
          from pathlib import Path
          path = Path('src/portable_runtime/governance/outcome_impact.py')
          text = path.read_text()
          old = '''    outcome_versions = _strings(metadata.get("subject_version_refs"))
    verification_scope = metadata.get("verification_scope")
    outcome_resource = verification_scope.get("resource") if isinstance(verification_scope, dict) else None
    declaration_complete = (
'''
          new = '''    outcome_versions = _strings(metadata.get("subject_version_refs"))
    normalized_outcome_versions = tuple(sorted(outcome_versions)) if outcome_versions is not None else ()
    verification_scope = metadata.get("verification_scope")
    outcome_resource = verification_scope.get("resource") if isinstance(verification_scope, dict) else None
    declaration_complete = (
'''
          if old not in text:
              raise SystemExit('P1b mypy anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('        or tuple(sorted(outcome_versions)) != declared_versions\n', '        or normalized_outcome_versions != declared_versions\n', 1)
          path.write_text(text)
      - shell: bash
        run: |
          rm .github/workflows/b3_p1b_mypy_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portable_runtime/governance/outcome_impact.py .github/workflows/b3_p1b_mypy_fix.yml
          git commit -m "fix: narrow Outcome applicability version binding"
          git push
